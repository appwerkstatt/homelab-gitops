# validate.yml — Required Check für Renovate-Automerge: prüft, dass renovate.json valide
# bleibt, jede Compose-Variable in .env.example (1Password-Liste) steht, jede
# Compose-Stack-Datei ohne Warnungen interpoliert, neu eingetragene Image-Tags für
# linux/amd64 existieren, die Alerting-Configs gültig sind, das Handbuch (docs/) ohne kaputte Links baut, die Grafana-Dashboards zum Generator passen, der Plane-Keycloak-Patch zur Plane-Version passt und der n8n-Keycloak-Hook mit der n8n-Version funktioniert und das Paperless-Setup-Skript zur Paperless-Version passt. Läuft auf jedem PR (also auch auf
# Renovate-PRs, weil die per GitHub-App-Token geöffnet werden -> NICHT GITHUB_TOKEN -> triggert
# Folge-Workflows). Der Job-Name "validate" IST der Status-Context, der in der Branch-
# Protection als Pflicht eingetragen wird.
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}   # manuell: prüft dann ALLE Images (check-images.sh --all)

# Redundante Läufe pro Ref abbrechen (spart Free-Tier-Minuten bei Renovate-PR-Schüben);
# pro PR eigene Group -> bricht nur ältere Läufe DESSELBEN PR ab, blockt keinen Required Check.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0          # Diff gegen die PR-Basis für check-images.sh

      - name: Validate renovate.json
        run: npx --yes --package renovate@43 -- renovate-config-validator --strict

      - name: Check every compose variable is listed in .env.example
        run: scripts/check-env.sh

      - name: Validate compose stacks (all variables set, warnings fail)
        run: |
          # Dummy-Env aus .env.example: op://-Referenzen -> Platzhalter, Inline-Kommentare weg.
          # So prüft compose die echte Interpolation, und jede Warnung (z.B. unbekannte
          # Variable, veraltetes Feld) lässt den Check scheitern statt nur zu loggen.
          sed -E -e '/^[A-Za-z_][A-Za-z0-9_]*=/!d' -e 's/[[:space:]]+#.*$//' -e 's|=op://.*|=ci-dummy|' .env.example > /tmp/ci.env
          fail=0
          for f in stacks/*/compose.yaml; do
            echo "::group::$f"
            out=$(docker compose --env-file /tmp/ci.env -f "$f" config -q 2>&1) || fail=1
            [ -n "$out" ] && echo "$out"
            if echo "$out" | grep -qiE 'warn|level=warning'; then
              echo "::error file=$f::docker compose meldet Warnungen"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Check changed images exist for linux/amd64
        if: github.event_name != 'push'
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-images.sh "origin/${{ github.base_ref }}"
          else
            scripts/check-images.sh --all
          fi

      - name: Validate alerting configs (vmalert rules, Alertmanager, blackbox)
        run: |
          cfg=stacks/20-observability/config
          vm=$(grep -oE 'victoriametrics/vmalert:[^ ]+' stacks/20-observability/compose.yaml)
          am=$(grep -oE 'prom/alertmanager:[^ ]+' stacks/20-observability/compose.yaml)
          bb=$(grep -oE 'prom/blackbox-exporter:[^ ]+' stacks/20-observability/compose.yaml)
          docker run --rm -v "$PWD/$cfg:/c:ro" "$vm" -rule=/c/alerts.yml -dryRun
          # Template mit Dummy-Werten rendern, wie es der Container beim Start tut
          mkdir -p /tmp/am
          sed -e 's|__TELEGRAM_BOT_TOKEN__|000:dummy|' -e 's|__TELEGRAM_CHAT_ID__|-1|' -e 's|__N8N_ALERT_WEBHOOK_TOKEN__|dummy|' "$cfg/alertmanager.tmpl.yml" > /tmp/am/alertmanager.yml
          docker run --rm -v /tmp/am:/c:ro --entrypoint amtool "$am" check-config /c/alertmanager.yml
          docker run --rm -v "$PWD/$cfg:/c:ro" "$bb" --config.file=/c/blackbox.yml --config.check
          va=$(grep -oE 'victoriametrics/vmauth:[^ ]+' stacks/20-observability/compose.yaml)
          docker run --rm -e N8N_OBS_READ_TOKEN=dummy -v "$PWD/$cfg:/c:ro" "$va" -auth.config=/c/vmauth.yml -dryRun
          al=$(grep -oE 'grafana/alloy:[^ ]+' stacks/20-observability/compose.yaml)
          docker run --rm -v "$PWD/$cfg:/c:ro" "$al" fmt /c/config.alloy >/dev/null
          lk=$(grep -oE 'grafana/loki:[^ ]+' stacks/20-observability/compose.yaml)
          docker run --rm -v "$PWD/$cfg:/c:ro" "$lk" -config.file=/c/loki.yaml -verify-config

      - name: Build handbook (mkdocs --strict, broken links fail)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          python3 -m venv /tmp/mkdocs
          /tmp/mkdocs/bin/pip install --quiet -r docs/requirements.txt
          /tmp/mkdocs/bin/mkdocs build --strict --site-dir /tmp/site
          # Image im Stack und CI-Version müssen gleich sein (sonst baut doku.lab anders als die CI)
          want=$(grep -oE '^mkdocs-material==[0-9.]+' docs/requirements.txt | cut -d= -f3)
          have=$(grep -oE 'squidfunk/mkdocs-material:[0-9.]+' stacks/15-doku/compose.yaml | cut -d: -f2)
          [ "$want" = "$have" ] || { echo "::error::mkdocs-material: requirements.txt $want, 15-doku $have"; exit 1; }

      - name: Check Grafana dashboards match build-dashboards.py
        run: |
          python3 stacks/20-observability/build-dashboards.py
          if [ -n "$(git status --porcelain -- stacks/20-observability/config/dashboards/homelab)" ]; then
            git status --short -- stacks/20-observability/config/dashboards/homelab
            echo "::error::Dashboard-JSONs veraltet: build-dashboards.py laufen lassen und die JSONs mitcommitten"
            exit 1
          fi

      - name: Check Plane Keycloak patch still matches upstream files
        # Renovate mergt Plane-Patches automatisch; ändert Upstream die Dateien, auf denen
        # stacks/14-plane/patches/gitea.py aufbaut, muss der Update-PR hier stehen bleiben.
        run: scripts/check-plane-patch.sh

      - name: Check n8n Keycloak hook works with the n8n version
        # Startet n8n aus stacks/13-n8n/compose.yaml mit hooks/keycloak-sso.js und prüft den Login im Browser.
        # Nur wenn sich n8n, der Hook oder der Test ändern (also auch bei Renovate-PRs für n8n), sonst zu teuer.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet "origin/${{ github.base_ref }}" -- stacks/13-n8n scripts/check-n8n-sso-hook.sh scripts/check-n8n-sso-hook.mjs; then
            echo "n8n und Hook unverändert, übersprungen"; exit 0
          fi
          scripts/check-n8n-sso-hook.sh

      - name: Check Paperless setup script works with the Paperless version
        # Startet Paperless aus stacks/11-paperless/compose.yaml frisch und prüft setup/paperless-setup.py samt
        # Consume-Workflows, Rechten und den Abfragen der n8n-Workflows. Nur wenn sich daran etwas ändert.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet "origin/${{ github.base_ref }}" -- stacks/11-paperless scripts/check-paperless-setup.sh scripts/check-paperless-setup.py stacks/13-n8n/workflows/paperless-fristen.json stacks/13-n8n/workflows/paperless-monatsbericht.json; then
            echo "Paperless und Setup unverändert, übersprungen"; exit 0
          fi
          scripts/check-paperless-setup.sh

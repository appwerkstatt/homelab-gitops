# validate.yml — Required Check für Renovate-Automerge: prüft, dass renovate.json valide
# bleibt, jede Compose-Variable in .env.example (1Password-Liste) steht und jede
# Compose-Stack-Datei syntaktisch parst. Läuft auf jedem PR (also auch auf
# Renovate-PRs, weil die per GitHub-App-Token geöffnet werden -> NICHT GITHUB_TOKEN -> triggert
# Folge-Workflows). Der Job-Name "validate" IST der Status-Context, der in der Branch-
# Protection als Pflicht eingetragen wird.
name: validate

on:
  pull_request:
  push:
    branches: [main]

# Redundante Läufe pro Ref abbrechen (spart Free-Tier-Minuten bei Renovate-PR-Schüben);
# pro PR eigene Group -> bricht nur ältere Läufe DESSELBEN PR ab, blockt keinen Required Check.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate renovate.json
        run: npx --yes --package renovate@43 -- renovate-config-validator --strict

      - name: Check every compose variable is listed in .env.example
        run: scripts/check-env.sh

      - name: Validate compose stacks
        run: |
          fail=0
          for f in stacks/*/compose.yaml; do
            echo "::group::$f"
            docker compose -f "$f" config -q || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Validate alerting configs (vmalert rules, Alertmanager, blackbox)
        run: |
          cfg=stacks/20-observability/config
          vm=$(grep -oE 'victoriametrics/vmalert:[^ ]+' stacks/20-observability/compose.yaml)
          am=$(grep -oE 'prom/alertmanager:[^ ]+' stacks/20-observability/compose.yaml)
          bb=$(grep -oE 'prom/blackbox-exporter:[^ ]+' stacks/20-observability/compose.yaml)
          docker run --rm -v "$PWD/$cfg:/c:ro" "$vm" -rule=/c/alerts.yml -dryRun
          # Template mit Dummy-Werten rendern, wie es der Container beim Start tut
          mkdir -p /tmp/am
          sed -e 's|__TELEGRAM_BOT_TOKEN__|000:dummy|' -e 's|__TELEGRAM_CHAT_ID__|-1|' "$cfg/alertmanager.tmpl.yml" > /tmp/am/alertmanager.yml
          docker run --rm -v /tmp/am:/c:ro --entrypoint amtool "$am" check-config /c/alertmanager.yml
          docker run --rm -v "$PWD/$cfg:/c:ro" "$bb" --config.file=/c/blackbox.yml --config.check

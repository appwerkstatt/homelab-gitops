# 00-traefik — Reverse Proxy + Wildcard-TLS (DNS-01) + erstellt das Netz "edge".
# Härtung: Traefik spricht NICHT direkt mit dem Docker-Socket, sondern über einen
# read-only socket-proxy (kein Host-Root-Risiko). Dashboard hinter SSO.
name: traefik

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1          # nur lesen, was Traefik braucht
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0                # KEINE schreibenden Docker-API-Calls
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    mem_limit: 64m
    restart: unless-stopped

  traefik:
    image: traefik:v3.7.10
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375    # statt direktem Socket
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.ssh.address=:22            # Git-over-SSH (.48:22 via TCP-Passthrough; kein Konflikt mit NAS-sshd auf .50)
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # Netz macht DNS-Interception (CGU/Split-Horizon) -> lokalen Propagations-Check abschalten;
      # lego wartet fix und Let's Encrypt prüft den TXT-Record selbst von außen.
      - --certificatesresolvers.le.acme.dnschallenge.propagation.disablechecks=true
      - --certificatesresolvers.le.acme.dnschallenge.propagation.delaybeforechecks=90s
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --api.dashboard=true
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    # KEIN ports:-Mapping — Traefik hört auf 80/443 seiner EIGENEN macvlan-IP (.48),
    # damit kein Konflikt mit der TrueNAS-Web-UI auf .50:80/443.
    volumes:
      - /mnt/fast/appdata/traefik:/data        # nur acme.json
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${LAB_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls.certresolver=le
      - traefik.http.routers.dashboard.tls.domains[0].main=${LAB_DOMAIN}
      - traefik.http.routers.dashboard.tls.domains[0].sans=*.${LAB_DOMAIN}
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=sso@docker   # Dashboard hinter Keycloak-Login (Stack 03)
    networks:
      vlan80:
        ipv4_address: 192.168.80.48   # eigene VLAN-IP; *.lab.appsfab.org zeigt hierauf
      edge:
        # cross-stack erreichbar (cloudflared, Backends). Die FQDN-Aliase loesen das
        # macvlan-Hairpin-Problem: serverseitige Container-Calls (OIDC-Discovery/Token/JWKS)
        # an die oeffentliche FQDN wuerden sonst auf .48 zeigen und scheitern (no route to host,
        # Host<->macvlan-Kind ist gesperrt). Ueber den Alias bleibt der Verkehr im edge-Bridge-Netz:
        # Docker-DNS -> Traefik-Bridge-IP -> SNI bleibt auth.* (Wildcard-Cert) -> Host-Routing an Keycloak.
        # Weitere intern serverseitig aufgerufene Hosts hier nachtragen (i.d.R. nur Keycloak noetig).
        aliases:
          - traefik
          - auth.${LAB_DOMAIN}
      socket: {}
    mem_limit: 256m
    restart: unless-stopped

networks:
  edge:
    name: edge          # erstellt das externe Netz; andere Stacks nutzen es als external
  socket:               # privates Netz nur zwischen Traefik und socket-proxy
  vlan80:
    name: vlan80        # macvlan; andere Stacks (z.B. Netboot) nutzen es als external
    driver: macvlan
    driver_opts:
      parent: enp3s0    # aktives 2,5-G-Interface; bei späterem LACP-Bond -> bond0
    ipam:
      config:
        - subnet: 192.168.80.0/24
          gateway: 192.168.80.1

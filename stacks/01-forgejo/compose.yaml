# 01-forgejo — Git-Hosting (SQLite, wie im Altsystem). Daten + Repos aus Phase 3.
name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.2
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: git.appsfab.org
      FORGEJO__server__ROOT_URL: https://git.appsfab.org/
      FORGEJO__server__SSH_DOMAIN: git.appsfab.org    # in den Klon-URLs angezeigter Host
      FORGEJO__server__SSH_PORT: "22"                 # Standard-SSH-Port (.48:22 via Traefik) -> keine :2222 in Klon-URLs
      # kein SSH_LISTEN_PORT: das normale Forgejo-Image nutzt den Container-OpenSSH auf Port 22
      #
      # OIDC-Quelle gegen Keycloak — EINMALIG nach dem ersten Start (liegt danach in gitea.db, persistent):
      #   docker exec -u git forgejo-forgejo-1 forgejo admin auth add-oauth \
      #     --name keycloak --provider openidConnect --key forgejo --secret '<KC_FORGEJO_SECRET>' \
      #     --auto-discover-url https://auth.lab.appsfab.org/realms/AppsFab/.well-known/openid-configuration \
      #     --scopes 'openid profile email' --group-claim-name groups --admin-group lab-admins
      # (--name=keycloak -> Callback /user/oauth2/keycloak/callback = Realm-Redirect-URI)
      # WICHTIG: 'groups' NICHT in --scopes (kein anforderbarer Scope, sondern Claim per Mapper) -> sonst invalid_scope.
      # --group-claim-name liest den groups-Claim aus dem Token; --admin-group mappt lab-admins -> Forgejo-Admin.
      # Auto-Registrierung/Account-Linking optional über die folgenden Env:
      # FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      # FORGEJO__oauth2_client__ACCOUNT_LINKING: "auto"
      # FORGEJO__oauth2_client__USERNAME: "preferred_username"
    volumes:
      - /mnt/fast/appdata/forgejo:/data       # enthält gitea.db + data/git + jwt/private.pem (migriert)
      - /etc/localtime:/etc/localtime:ro
    # kein Host-Port-Mapping mehr — SSH läuft über Traefik (.48:2222), nicht über den NAS-Host (.50)
    labels:
      - traefik.enable=true
      # HTTPS (Web-UI + Git-over-HTTPS):
      - traefik.http.routers.forgejo.rule=Host(`git.appsfab.org`)
      - traefik.http.routers.forgejo.entrypoints=websecure
      - traefik.http.routers.forgejo.tls.certresolver=le
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      # Git-over-SSH (TCP-Passthrough über Traefik-Entrypoint ssh = .48:2222):
      - traefik.tcp.routers.forgejo-ssh.rule=HostSNI(`*`)
      - traefik.tcp.routers.forgejo-ssh.entrypoints=ssh
      - traefik.tcp.routers.forgejo-ssh.service=forgejo-ssh
      - traefik.tcp.services.forgejo-ssh.loadbalancer.server.port=22   # Container-OpenSSH lauscht auf 22
    networks: [edge]
    mem_limit: 1g
    restart: unless-stopped

networks:
  edge:
    external: true

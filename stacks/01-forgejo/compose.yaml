# 01-forgejo — Git-Hosting (SQLite, wie im Altsystem). Daten + Repos aus Phase 3.
name: forgejo

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: git.appsfab.org
      FORGEJO__server__ROOT_URL: https://git.appsfab.org/
      FORGEJO__server__SSH_DOMAIN: git.appsfab.org    # in den Klon-URLs angezeigter Host
      FORGEJO__server__SSH_PORT: "22"                 # Standard-SSH-Port (.48:22 via Traefik) -> keine :2222 in Klon-URLs
      # Web-Login nur per SSO (Keycloak): Benutzername/Passwort-Formular ausgeblendet.
      # Notzugang, falls Keycloak down ist: Wert auf "true" setzen oder per CLI arbeiten
      #   (docker exec -u git forgejo-forgejo-1 forgejo admin user ...).
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: "false"
      # Kein Passwort per Basic Auth auf API und Git-over-HTTPS (Security-Check 2026-11-22, H1): sonst gingen lokale
      # Passwörter aus dem Internet an Keycloak/Passkey/2FA und jeder Brute-Force-Sperre vorbei. Tokens funktionieren weiter
      # (PAT als Passwort oder "Authorization: token …", z. B. FORGEJO_TOKEN der Netboot-Konsole), SSH ebenso.
      FORGEJO__service__ENABLE_BASIC_AUTHENTICATION: "false"
      # Klassisches OpenID 2.0 ("Mit OpenID fortfahren") aus — Login nur über die Keycloak-Quelle.
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
      FORGEJO__openid__ENABLE_OPENID_SIGNUP: "false"
      # kein SSH_LISTEN_PORT: das normale Forgejo-Image nutzt den Container-OpenSSH auf Port 22
      #
      # OIDC-Quelle gegen Keycloak — EINMALIG nach dem ersten Start (liegt danach in gitea.db, persistent):
      #   docker exec -u git forgejo-forgejo-1 forgejo admin auth add-oauth \
      #     --name keycloak --provider openidConnect --key forgejo --secret '<KC_FORGEJO_SECRET>' \
      #     --auto-discover-url https://auth.appsfab.org/realms/AppsFab/.well-known/openid-configuration \
      #     --scopes 'openid profile email' --group-claim-name groups --admin-group lab-admins \
      #     --required-claim-name groups --required-claim-value lab-users
      # (--name=keycloak -> Callback /user/oauth2/keycloak/callback = Realm-Redirect-URI)
      # Bestehende Quelle (ID 6) nachziehen: forgejo admin auth update-oauth --id 6 \
      #     --required-claim-name groups --required-claim-value lab-users   (danach Container neu starten)
      # --required-claim-*: Login nur mit Keycloak-Gruppe lab-users (exakter Eintrag im groups-Claim).
      # WICHTIG: 'groups' NICHT in --scopes (kein anforderbarer Scope, sondern Claim per Mapper) -> sonst invalid_scope.
      # --group-claim-name liest den groups-Claim aus dem Token; --admin-group mappt lab-admins -> Forgejo-Admin.
      # Auto-Registrierung/Account-Linking optional über die folgenden Env:
      # FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      # FORGEJO__oauth2_client__ACCOUNT_LINKING: "auto"
      # FORGEJO__oauth2_client__USERNAME: "preferred_username"
    volumes:
      - /mnt/fast/appdata/forgejo:/data       # enthält gitea.db + data/git + jwt/private.pem (migriert)
      - /etc/localtime:/etc/localtime:ro
    # kein Host-Port-Mapping — SSH läuft über Traefik (.48:22), nicht über den NAS-Host (.50)
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-forgejo
      # HTTPS (Web-UI + Git-over-HTTPS):
      - traefik.http.routers.forgejo.rule=Host(`git.appsfab.org`)
      - traefik.http.routers.forgejo.entrypoints=websecure,tunnel   # tunnel = öffentlich über cloudflared (00-traefik)
      - traefik.http.routers.forgejo.tls.certresolver=le
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
      # Login-Seite überspringen: /user/login direkt zur Keycloak-Quelle umleiten (nur SSO, siehe ENABLE_INTERNAL_SIGNIN).
      # Query (z. B. redirect_to) wird mitgenommen. Rückbau: die forgejo-login/forgejo-sso-redirect-Labels entfernen.
      - traefik.http.routers.forgejo-login.rule=Host(`git.appsfab.org`) && Path(`/user/login`)
      - traefik.http.routers.forgejo-login.entrypoints=websecure,tunnel   # tunnel = öffentlich über cloudflared (00-traefik)
      - traefik.http.routers.forgejo-login.tls.certresolver=le
      - traefik.http.routers.forgejo-login.middlewares=forgejo-sso-redirect
      - traefik.http.routers.forgejo-login.service=forgejo
      - traefik.http.middlewares.forgejo-sso-redirect.redirectregex.regex=^https?://([^/]+)/user/login(.*)$$
      - traefik.http.middlewares.forgejo-sso-redirect.redirectregex.replacement=https://$${1}/user/oauth2/keycloak$${2}
      # Git-over-SSH (TCP-Passthrough über Traefik-Entrypoint ssh = .48:22):
      - traefik.tcp.routers.forgejo-ssh.rule=HostSNI(`*`)
      - traefik.tcp.routers.forgejo-ssh.entrypoints=ssh
      - traefik.tcp.routers.forgejo-ssh.service=forgejo-ssh
      - traefik.tcp.services.forgejo-ssh.loadbalancer.server.port=22   # Container-OpenSSH lauscht auf 22
    networks: [edge-forgejo, edge-netboot]   # edge-netboot: netboot-console klont/pusht direkt über http://forgejo:3000
    mem_limit: 1g
    restart: unless-stopped

networks:
  edge-forgejo:
    external: true   # von 00-traefik angelegt; nur Traefik teilt es mit diesem Stack
  edge-netboot:
    external: true   # geteilt mit 30-netboot (console → forgejo:3000)

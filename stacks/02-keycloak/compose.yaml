# 02-keycloak — IAM/SSO (Keycloak 26 + Postgres 17). DB-Dump aus Phase 3 einspielen.
name: keycloak

services:
  keycloak-db:
    image: postgres:17.8-alpine          # Major 17 wie im Altsystem (Migration!)
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - /mnt/fast/appdata/keycloak/db:/var/lib/postgresql/data
    networks: [kc-internal]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    command:
      - start
      - --hostname=https://auth.${LAB_DOMAIN}
      - --proxy-headers=xforwarded
      - --http-enabled=true
      - --import-realm           # importiert realm/AppsFab-realm.json NUR falls Realm fehlt
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      # Realm-as-Code: greift nur bei frischem Start (DR/Neuaufbau ohne DB-Migration).
      # Nach erfolgreicher Phase-3-DB-Migration ist der Realm bereits da → Import wird übersprungen.
      - ./realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.${LAB_DOMAIN}`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=le
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    networks: [edge, kc-internal]
    mem_limit: 1g
    restart: unless-stopped

  # Realm-Reconcile: applies realm/AppsFab-realm.json to the running Keycloak on every
  # (re)deploy, then exits. Complements --import-realm (which only seeds an empty DB).
  # One-shot: restart "no". Waits for Keycloak via kcc's own availability check, so the
  # keycloak service needs no healthcheck (its image is distroless — no curl/wget).
  #
  # Realm placeholders use kcc's DEFAULT substitution syntax $(env:VAR) — prefix "$(",
  # suffix ")" — which deliberately avoids Keycloak's own ${...} placeholders. We rely on
  # the default (the image tag is pinned, so the default is fixed) rather than setting
  # IMPORT_VARSUBSTITUTION_PREFIX/SUFFIX here, because "$(" in a compose value would be
  # mangled by Compose's own $-interpolation.
  keycloak-config-cli:
    image: adorsys/keycloak-config-cli:6.5.0-26.5.4   # tag = {kcc-version}-{keycloak-version}; Renovate-tracked
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      # Auth as a dedicated master-realm service account (client_credentials), NOT a human
      # login or the bootstrap admin. Create the client once in the master realm:
      # client `keycloak-config-cli`, client authentication ON, service accounts ON,
      # assign the master realm-role `admin`. Put its secret in the Arcane env as
      # KCC_CLIENT_SECRET. See RECONCILE.md → "kcc service account".
      KEYCLOAK_LOGINREALM: master
      KEYCLOAK_GRANTTYPE: client_credentials
      KEYCLOAK_CLIENTID: keycloak-config-cli
      KEYCLOAK_CLIENTSECRET: ${KCC_CLIENT_SECRET}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"     # poll Keycloak until ready before importing
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"
      IMPORT_FILES_LOCATIONS: /config/AppsFab-realm.json
      IMPORT_VARSUBSTITUTION_ENABLED: "true"         # enable $(env:VAR) substitution (default prefix/suffix)
      # Bump on every realm/ change. A changed env value forces Compose to recreate this
      # one-shot (so it re-runs), AND touching compose.yaml guarantees Arcane redeploys the
      # stack (a realm-only file edit alone may not trigger either). See RECONCILE.md.
      KCC_REALM_REV: "4"
      # OIDC client secrets — resolved into the realm by $(env:...). Same vars the consumers read.
      GRAFANA_OIDC_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      FORGEJO_OIDC_CLIENT_SECRET: ${FORGEJO_OIDC_CLIENT_SECRET}
      NETBOOT_OIDC_CLIENT_SECRET: ${NETBOOT_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
    volumes:
      - ./realm:/config:ro
    networks: [kc-internal]
    restart: "no"
    mem_limit: 512m

networks:
  edge:
    external: true
  kc-internal:

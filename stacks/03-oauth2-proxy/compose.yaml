# 03-oauth2-proxy — Traefik-ForwardAuth gegen Keycloak.
# Schützt Dienste OHNE eigenes OIDC (z.B. Traefik-Dashboard, Netboot-Konsole, S3-Browser-UIs)
# mit einem Keycloak-Login. Nutzt den Realm-Client "oauth2-proxy" (AppsFab-realm.json).
name: oauth2-proxy

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3   # akt. Stand 2026-04; behebt Auth-Bypass + Session-Fixation (CVE-Fixes ggü. 7.7.x)
    command:
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.16.0.0/12   # X-Forwarded-* nur von Docker-internen Proxy-IPs (Traefik im edge-Netz) akzeptieren
      - --skip-provider-button=true        # ohne Zwischenseite direkt zu Keycloak; unauth. Request -> 302 (fail-closed)
      - --provider=keycloak-oidc
      - --scope=openid email profile        # explizit ohne "groups": der keycloak-oidc-Provider haengt sonst "groups" an,
                                             # das ist aber kein anforderbarer Scope (groups-Claim kommt per Client-Mapper im Realm) -> sonst invalid_scope
      - --oidc-issuer-url=https://auth.${LAB_DOMAIN}/realms/AppsFab
      - --client-id=oauth2-proxy
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}    # openssl rand -base64 32
      - --cookie-domain=.${LAB_DOMAIN}
      - --whitelist-domain=.${LAB_DOMAIN}
      - --email-domain=*
      - --oidc-groups-claim=groups
      - --allowed-group=lab-users         # RBAC: nur Mitglieder dieser Keycloak-Gruppe dürfen durch
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --upstream=static://202
    labels:
      - traefik.enable=true
      # /oauth2/* auf allen Lab-Hosts zum Proxy routen (Login-/Callback-Endpunkte):
      - traefik.http.routers.oauth2-proxy.rule=Host(`auth-proxy.${LAB_DOMAIN}`) || PathPrefix(`/oauth2`)
      - traefik.http.routers.oauth2-proxy.entrypoints=websecure
      - traefik.http.routers.oauth2-proxy.tls.certresolver=le
      - traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180
      # Wiederverwendbare Middleware "sso" — an geschützten Routern referenzieren.
      # Adresse zeigt auf "/" (nicht /oauth2/auth): bei fehlender Session liefert oauth2-proxy
      # selbst einen 302 zu Keycloak, den Traefik durchreicht (offiziell dokumentierte "static upstream"-Variante).
      - traefik.http.middlewares.sso.forwardauth.address=http://oauth2-proxy:4180/
      - traefik.http.middlewares.sso.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.sso.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups
    networks: [edge]
    mem_limit: 128m
    restart: unless-stopped

# Anwenden auf einen Dienst (Beispiel): am jeweiligen Router das Label setzen
#   traefik.http.routers.<dienst>.middlewares=sso@docker
# z.B. Traefik-Dashboard (00-traefik), Netboot-Konsole (30-netboot), optionales S3-Browser-UI.
#
# WICHTIG: oauth2-proxy leitet pro Host auf https://<host>.lab.appsfab.org/oauth2/callback um.
# Keycloak matcht KEINEN Host-Wildcard in redirect_uri → für JEDEN neu hinter sso gehängten
# Dienst dessen Callback explizit beim Client "oauth2-proxy" eintragen
# (02-keycloak/realm/AppsFab-realm.json, redirectUris+webOrigins) und KCC_REALM_REV bumpen.

networks:
  edge:
    external: true

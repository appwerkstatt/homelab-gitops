# 11-paperless — Dokumentenarchiv (Paperless-ngx + Postgres 17 + Redis) + paperless-ai (RAG via Ollama)
# DB-Dump aus Phase 3; Medien liegen auf data/paperless.
name: paperless

services:
  paperless-db:
    image: postgres:17.12-alpine          # NICHT auf 18 bumpen: pg_upgrade nötig (Incident 2026-06-05)
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: ${PAPERLESS_DB_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - /mnt/fast/appdata/paperless/db:/var/lib/postgresql/data
    networks: [pl-internal]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  paperless-redis:
    image: redis:8.10-alpine   # Minor-Tag bewusst: immer gültig + neuester 8.10-Patch; zustandsloser Celery-Broker
    volumes:
      - /mnt/fast/appdata/paperless/redis:/data
    networks: [pl-internal]
    mem_limit: 128m
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: https://docs.${LAB_DOMAIN}
      # Seit 3.5 gilt ohne diese Variable nur der Host aus PAPERLESS_URL (+ localhost). paperless-ai ruft
      # http://paperless:8000/api im Netz pl-internal auf, sonst HTTP 400 (Vorfall 2026-11-27).
      PAPERLESS_ALLOWED_HOSTS: paperless
      PAPERLESS_TIME_ZONE: ${TZ}
      # OCR deutsch + englisch (ohne die Variable nur eng -> Umlaute/ß falsch). deu ist im Image enthalten.
      PAPERLESS_OCR_LANGUAGE: deu+eng
      # Unterordner im Consume-Ordner (christian/, gisa/, haushalt/) legen per Workflow Besitzer und Freigabe fest
      # (stacks/11-paperless/setup/paperless-setup.py). Keine Tags aus Ordnernamen.
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      # --- Keycloak-Login (OIDC über allauth, Client `paperless`) ---
      # Server-Calls an auth.appsfab.org gehen über den Traefik-Alias im Netz edge-paperless.
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "keycloak", "name": "Keycloak",
        "client_id": "paperless", "secret": "${PAPERLESS_OIDC_CLIENT_SECRET}",
        "settings": {"server_url": "https://auth.appsfab.org/realms/AppsFab/.well-known/openid-configuration"}}]}}
      # Keycloak legt KEINE Paperless-Konten an (Default wäre "yes"): nur bestehende Konten, die die Person
      # einmal unter Profil -> "Verbinden" mit Keycloak verknüpft hat. Rechte und Gruppen (haushalt) bleiben in Paperless.
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "false"
      PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
      # Schritt 2, wenn alle verknüpft haben: beide auf "true" (nur noch Keycloak, Login-Seite springt direkt dorthin).
      PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "false"
      # --- Eingebaute KI (seit 3.0): Vorschläge + Chat, über Ollama auf dem Mac Studio ---
      # Soll paperless-ai ablösen. Der Chat sucht nur in Dokumenten, die die angemeldete Person sehen darf.
      # Index-Update läuft nachts 02:10 (Default). Nach dem ersten Deploy und nach jedem Wechsel des
      # Embedding-Modells einmal von Hand bauen:
      #   docker exec paperless-paperless-1 document_llmindex rebuild
      # Werte, die in der UI (Einstellungen -> KI) gespeichert sind, gewinnen gegen diese Variablen.
      PAPERLESS_AI_ENABLED: "true"
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_ENDPOINT: http://192.168.80.30:11434   # gleicher Weg wie paperless-ai (Mac-pf lässt nur das NAS durch)
      PAPERLESS_AI_LLM_MODEL: qwen2.5:14b
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama              # Embeddings auf dem Mac, nicht im Container
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: nomic-embed-text
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: "300"                 # 14b lokal: Chat über viele Dokumente kann >120 s dauern
    volumes:
      - /mnt/data/paperless/media:/usr/src/paperless/media       # Dokumente (bleiben auf data)
      - /mnt/data/paperless/consume:/usr/src/paperless/consume   # SMB-Eingang (Scanner, Mac), Unterordner = Besitzer
      - /mnt/data/paperless/export:/usr/src/paperless/export
      - /mnt/fast/appdata/paperless/data:/usr/src/paperless/data
    depends_on: [paperless-db, paperless-redis]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-paperless
      - traefik.http.routers.paperless.rule=Host(`docs.${LAB_DOMAIN}`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls.certresolver=le
      - traefik.http.services.paperless.loadbalancer.server.port=8000
    networks: [edge-paperless, pl-internal]
    mem_limit: 1536m      # +512m Puffer für die KI (llama-index im Prozess, Embeddings rechnet Ollama)
    restart: unless-stopped

  paperless-ai:
    image: clusterzx/paperless-ai:4.8.0       # bestätigt (Docker Hub); aktuelle Stable
    environment:
      PAPERLESS_API_URL: http://paperless:8000/api
      PAPERLESS_API_TOKEN: ${PAPERLESS_AI_API_KEY}   # in Paperless erzeugen (Profil -> API-Token)
      AI_PROVIDER: ollama
      OLLAMA_API_URL: http://192.168.80.30:11434     # Ollama auf dem Mac Studio, direkt im .80-VLAN (Fremd-Host -> kein Hairpin)
      OLLAMA_MODEL: qwen2.5:14b
      OLLAMA_EMBED_MODEL: nomic-embed-text
    volumes:
      - /mnt/fast/appdata/paperless-ai:/app/data       # ChromaDB + documents.db (migriert)
    depends_on: [paperless]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-paperless
      - traefik.http.routers.paperless-ai.rule=Host(`docs-ai.${LAB_DOMAIN}`)
      - traefik.http.routers.paperless-ai.entrypoints=websecure
      - traefik.http.routers.paperless-ai.tls.certresolver=le
      - traefik.http.routers.paperless-ai.middlewares=sso-admin@docker   # nur lab-admins (Stack 03): API-Token mit Zugriff auf alle Dokumente; Callback im Realm-Client oauth2-proxy
      - traefik.http.services.paperless-ai.loadbalancer.server.port=3000
    networks: [edge-paperless, pl-internal]
    # v4 rechnet RAG-Embeddings lokal (Xenova multilingual-e5-small, 3 Threads) -> 512m reichte
    # nicht (OOM-Kill des node-Prozesses beim Embedding, Restart-Loop 2026-11-21).
    mem_limit: 2g
    restart: unless-stopped

networks:
  edge-paperless:
    external: true   # von 00-traefik angelegt; nur Traefik teilt es mit diesem Stack
  pl-internal:

# Cloudflared Tunnel — locally-managed (credentials.json aus der Migration).
# SICHERHEIT: NUR explizit gelistete Hosts sind von außen erreichbar; alles andere -> 404.
# Tunnel-ID/Name aus credentials.json übernehmen.
tunnel: 61570dd5-74aa-409e-8963-1ef61a368753
credentials-file: /etc/cloudflared/credentials.json

# Nach jeder Änderung hier: CF_INGRESS_REV in compose.yaml hochzählen (sonst kein Neustart).
ingress:
  # --- explizit veröffentlichte Dienste (nur was WIRKLICH öffentlich sein muss) ---
  - hostname: git.appsfab.org
    service: https://traefik:443
    originRequest:
      originServerName: git.appsfab.org      # SNI, damit Traefik das richtige Cert liefert

  # n8n-Webhooks — öffentlich, damit externe Dienste (GitHub, Telegram, …) Workflows auslösen können.
  # Traefik routet auf diesem Host NUR /webhook/ (Router n8n-hooks, 13-n8n), alles andere -> 404.
  # Absicherung pro Workflow: Header-Auth bzw. Signaturprüfung im Webhook-Node.
  - hostname: hooks.appsfab.org
    service: https://traefik:443
    originRequest:
      originServerName: hooks.appsfab.org     # SNI → Traefik liefert das LE-Cert für hooks.appsfab.org

  # Weitere Hosts NUR bei echtem Bedarf freischalten (Beispiel, bewusst auskommentiert):
  # - hostname: docs.appsfab.org
  #   service: https://traefik:443
  #   originRequest:
  #     originServerName: docs.lab.appsfab.org

  # Keycloak-Login — öffentlich, damit Cluster-Demo-App-SSO aus dem Internet abschließt.
  # Einstufiger Name, weil Cloudflares Gratis-Zertifikat nur *.appsfab.org abdeckt (auth.lab.* hatte
  # dort KEIN Zertifikat → TLS-Abbruch). auth.lab.appsfab.org bleibt rein intern (Admin-Konsole, LAN).
  # /admin + /realms/master liefern über den Tunnel 403 (Traefik-Router keycloak-admin, ipallowlist).
  - hostname: auth.appsfab.org
    service: https://traefik:443
    originRequest:
      originServerName: auth.appsfab.org       # SNI → Traefik liefert das LE-Cert für auth.appsfab.org

  # --- Pflicht: Catch-all lehnt alles Nicht-Gelistete ab ---
  - service: http_status:404

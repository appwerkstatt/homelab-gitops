# Statische Auslieferung des gebauten Handbuchs. /site/current ist ein Symlink auf den letzten Build.
server {
    listen 8080;
    server_name _;
    root /site/current;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # HTML immer frisch, Assets (mit Hash im Namen) lange cachen
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location /assets/   { add_header Cache-Control "public, max-age=604800"; }
}

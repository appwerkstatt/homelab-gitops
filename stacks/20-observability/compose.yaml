  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:0.146.0
  #   command: [--config=/etc/otel/config.yaml]
  #   volumes:
  #     - ./config/otel.yaml:/etc/otel/config.yaml:ro
  #   networks: [obs, edge]
  #   mem_limit: 256m
  #   restart: unless-stopped

networks:
  edge:
    external: true
  obs:

# 20-observability — Umbau Prometheus -> VictoriaMetrics. + Loki + Grafana + Exporter.
# Grafana-DB (Dashboards) aus Phase 3 migriert. VictoriaMetrics ist PromQL-/remote_write-kompatibel.
name: observability

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.144.0   # neuestes Community-Regular-Release (Stand 2026-05).
    # ACHTUNG: LTS-Patch-Releases (v1.136.x .1+) sind NUR Enterprise-Images -> Community zieht die Regular-Linie; Renovate hält sie aktuell.
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=12                # Monate
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.maxScrapeSize=32MiB    # Sicherheitsnetz: cadvisor-/metrics kann >16MiB sein
      - -httpListenAddr=:8428              # remote_write-Ziel + PromQL-API für Grafana & Cluster
    volumes:
      - /mnt/fast/appdata/vm:/storage
      - ./config/scrape.yml:/etc/vm/scrape.yml:ro
    networks: [obs]
    mem_limit: 1g
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.6
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - /mnt/fast/appdata/loki:/loki
      - ./config/loki.yaml:/etc/loki/loki.yaml:ro
    networks: [obs]
    mem_limit: 512m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.3
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${LAB_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${LAB_DOMAIN}/realms/AppsFab/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${LAB_DOMAIN}/realms/AppsFab/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${LAB_DOMAIN}/realms/AppsFab/protocol/openid-connect/userinfo
      # RBAC: Keycloak-Gruppe lab-admins -> Grafana-Admin, sonst Viewer
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'lab-admins') && 'Admin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - /mnt/fast/appdata/grafana:/var/lib/grafana    # grafana.db = migrierte Dashboards
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro   # VM + Loki deklarativ
      - ./config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/provider.yaml:ro        # Dashboard-Provider (IaC)
      - ./config/dashboards:/etc/dashboards:ro                                                        # Dashboard-JSONs (IaC)
    mem_limit: 512m
    depends_on: [victoriametrics, loki]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${LAB_DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    networks: [edge, obs]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.11.1   # neuester Stand (07.04.2026)
    command: [--path.rootfs=/host]
    volumes: ["/:/host:ro,rslave"]
    networks: [obs]
    mem_limit: 128m
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    command:
      - -logtostderr
      - -docker_only=true                # nur Container, keine rohen cgroups
      - -store_container_labels=false     # Container-Labels nicht als Metric-Labels (Kardinalität)
      - -housekeeping_interval=30s        # passt zum scrape_interval
      # verbose/selten genutzte Collectors aus -> /metrics deutlich kleiner:
      - -disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,percpu
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [obs]
    mem_limit: 256m
    restart: unless-stopped

  # --- VORERST DEAKTIVIERT: Configs fehlen (waren "aus Altsystem übernehmen") ---
  # Wieder aktivieren, sobald config/alertmanager.yml bzw. config/otel.yaml vorliegen
  # (aus Phase-0-Backup zurückholen oder frisch schreiben). Beide sind fürs
  # Kern-Monitoring (Metriken/Logs/Dashboards/OIDC) NICHT erforderlich.

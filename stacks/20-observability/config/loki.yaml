# Loki SingleBinary, filesystem-Backend (Lernwert-Upgrade: Garage-S3-Backend via 21-garage).
auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 744h     # 31 Tage
# Retention greift NUR über den Compactor (retention_enabled). Ohne diesen Block löscht
# Loki nie Chunks und /mnt/fast/appdata/loki wächst unbegrenzt.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem   # Pflicht, sobald retention_enabled=true

# 21-minio — S3-kompatibler Object Store (Backend für Loki-Chunks, Velero, Artefakte).
name: minio

services:
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z   # ACHTUNG: MinIO-Community-Images EOL (Repo archiviert 04/2026),
    # dies ist der letzte freie Tag. Alternative erwägen: Garage oder SeaweedFS (S3-kompatibel, aktiv gepflegt).
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://s3-console.${LAB_DOMAIN}
    volumes:
      - /mnt/data/minio:/data           # auf data (Mirror); große Buckets ggf. auf backup
    labels:
      - traefik.enable=true
      # S3-API:
      - traefik.http.routers.minio-api.rule=Host(`s3.${LAB_DOMAIN}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls.certresolver=le
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      # Web-Console:
      - traefik.http.routers.minio-console.rule=Host(`s3-console.${LAB_DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls.certresolver=le
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    networks: [edge]
    mem_limit: 1g
    restart: unless-stopped

# Buckets nach dem ersten Start anlegen (mc oder Console): loki, velero, artifacts.

networks:
  edge:
    external: true

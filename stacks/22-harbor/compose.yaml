# 22-harbor — Zot (OCI-Registry): Private-Registry (netboot-console, lab-status) UND
# Public-Pull-Through-Cache (sync onDemand: docker.io/ghcr.io/quay.io/registry.k8s.io).
name: registryzot

services:
  # Zot (distroless, keine Shell) liest das OIDC-Client-Secret nur aus einer Datei ->
  # Einmal-Init schreibt sie aus der Arcane-Env in ein privates Volume.
  zot-oidc-init:
    image: alpine:3.22.2
    environment:
      ZOT_OIDC_CLIENT_SECRET: ${ZOT_OIDC_CLIENT_SECRET}   # 1Password: AppsFab/homelab-zot/oidc-client-secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 022 &&
        printf '{"clientid":"zot","clientsecret":"%s"}\n' "$$ZOT_OIDC_CLIENT_SECRET" > /run/zot/oidc-credentials.json
    volumes:
      - zot-secrets:/run/zot
    network_mode: none
    restart: "no"

  zot:
    image: ghcr.io/project-zot/zot:v2.1.23     # neuester Patch der v2.1.x-Linie (Stand 2026-03)
    ports:
      # NAS-lokaler Pull-Pfad: der NAS-Host kann die macvlan-IP .48 (Traefik) nicht erreichen
      # (Hairpin), also Zot zusätzlich auf 127.0.0.1:5000 — Docker behandelt loopback automatisch
      # als insecure. Externe Clients (Mac-Push, k3s) nutzen weiter registry.lab.appsfab.org via Traefik.
      - "127.0.0.1:5000:5000"
    volumes:
      - /mnt/data/harbor/zot:/var/lib/registry
      - ./config/zot.json:/etc/zot/config.json:ro
      - /mnt/fast/appdata/registry/htpasswd:/etc/zot/htpasswd:ro   # bcrypt-htpasswd (Robots ci + pull); Secret bleibt auf dem NAS, nicht in Git
      - zot-secrets:/run/zot:ro                                    # oidc-credentials.json (zot-oidc-init)
    depends_on:
      zot-oidc-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.registry.rule=Host(`registry.${LAB_DOMAIN}`)
      - traefik.http.routers.registry.entrypoints=websecure
      - traefik.http.routers.registry.tls.certresolver=le
      - traefik.http.services.registry.loadbalancer.server.port=5000
    networks: [edge]
    mem_limit: 512m   # sync-Cache + UI/Trivy/scrub im selben Container
    restart: unless-stopped

networks:
  edge:
    external: true

volumes:
  zot-secrets:

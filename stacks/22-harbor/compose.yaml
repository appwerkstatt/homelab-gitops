# 22-harbor — Zot (OCI-Registry): Private-Registry (netboot-console, lab-status) UND
# Public-Pull-Through-Cache (sync onDemand: docker.io/ghcr.io/quay.io/registry.k8s.io).
name: registry

services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.17     # neuester Patch der v2.1.x-Linie (Stand 2026-03)
    ports:
      # NAS-lokaler Pull-Pfad: der NAS-Host kann die macvlan-IP .48 (Traefik) nicht erreichen
      # (Hairpin), also Zot zusätzlich auf 127.0.0.1:5000 — Docker behandelt loopback automatisch
      # als insecure. Externe Clients (Mac-Push, k3s) nutzen weiter registry.lab.appsfab.org via Traefik.
      - "127.0.0.1:5000:5000"
    volumes:
      - /mnt/data/harbor/zot:/var/lib/registry
      - ./config/zot.json:/etc/zot/config.json:ro
      - /mnt/fast/appdata/registry/htpasswd:/etc/zot/htpasswd:ro   # bcrypt-htpasswd (ci-Robot); Secret bleibt auf dem NAS, nicht in Git
    labels:
      - traefik.enable=true
      - traefik.http.routers.registry.rule=Host(`registry.${LAB_DOMAIN}`)
      - traefik.http.routers.registry.entrypoints=websecure
      - traefik.http.routers.registry.tls.certresolver=le
      - traefik.http.services.registry.loadbalancer.server.port=5000
    networks: [edge]
    mem_limit: 512m   # sync-Cache + UI/Trivy/scrub im selben Container
    restart: unless-stopped

networks:
  edge:
    external: true

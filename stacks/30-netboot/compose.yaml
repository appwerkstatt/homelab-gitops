# 30-netboot — CUSTOM-APP: Pi-5-Netboot-Provisionierung.
# dnsmasq (Proxy-DHCP+TFTP, eigene IP .49 via macvlan) + nginx (Seeds/Images) + Go-Konsole.
# Daten bleiben auf data/provisioning (kein Re-Build). NFS-Exporte (nfsroot/control) aus Phase 1.5.
name: netboot

services:
  dnsmasq:
    image: dockurr/dnsmasq:2.92      # gepinnt (war :latest = Update-Risiko)
    cap_add: [NET_ADMIN]
    volumes:
      - /mnt/data/provisioning/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - /mnt/data/provisioning/tftpboot:/tftpboot        # muss zu tftp-root in dnsmasq.conf passen (/tftpboot)
    networks:
      vlan80:
        ipv4_address: 192.168.80.49      # eigene MAC/IP auf dem geteilten vlan80-macvlan (aus 00-traefik, parent enp3s0)
    mem_limit: 64m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine          # gepinnt (war :alpine = floating)
    volumes:
      - /mnt/data/provisioning/nginx-seed.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/data/provisioning/http:/usr/share/nginx/html:ro   # /images/ -> /usr/share/nginx/html/images/ (Golden-Images)
      - /mnt/data/provisioning/seed:/srv/seed:ro               # /seed/ per anfragender Node-IP
    networks:
      # eigene macvlan-IP statt Host-Publish: nginx sieht die ECHTE Pi-Quell-IP,
      # nötig für den Per-Node-Seed (nginx-seed.conf mappt $remote_addr -> $cinode).
      vlan80:
        ipv4_address: 192.168.80.47
    mem_limit: 64m
    restart: unless-stopped

  console:
    # NAS-lokaler Pull-Pfad (127.0.0.1:5000 = Zot, siehe 22-harbor) — der NAS-Host erreicht
    # registry.lab.appsfab.org (.48/Traefik) wegen macvlan-Hairpin nicht.
    image: 127.0.0.1:5000/library/netboot-console:753aa461af9b   # CI-gebaut (Git-SHA, immutable) — Phase 2g (Wipe-via-SSH)
    environment:
      LISTEN_ADDR: ":8081"
      # --- OIDC gegen Keycloak (Client netboot-console) ---
      OIDC_ISSUER: https://auth.${LAB_DOMAIN}/realms/AppsFab
      OIDC_CLIENT_ID: netboot-console
      OIDC_CLIENT_SECRET: ${NETBOOT_OIDC_CLIENT_SECRET}      # in Keycloak regenerieren
      OIDC_REDIRECT_URL: https://netboot.${LAB_DOMAIN}/auth/callback   # App-Route ist /auth/callback (main.go)
      OIDC_SCOPES: openid,profile,email                      # KEIN groups (Claim kommt per Mapper)
      ARM_GROUPS: lab-admins                                 # nur diese Keycloak-Gruppe darf "armen"
      COOKIE_SECURE: "true"                                  # hinter Traefik-TLS
      # --- Pfade ---
      CONTROL_DIR: /control
      SEED_DIR: /seed
      CLOUDINIT_DIR: /opt/console/cloud-init                 # ins Image kopiert
      IMAGE_DIR: /images                                     # Golden-Images für den nodes.yaml-Editor (ro)
      # --- Phase 2b: Inventory-Write-Pfad (PUT/render/commit/push) ---
      # Repo-Working-Tree liegt unter /opt/console/repo (bind-mount unten). Beim
      # ersten Start klont der entrypoint von FORGEJO_CLONE_URL (docker-internes
      # http://forgejo:3000/... — forgejo+console teilen das edge-Netz, also
      # geht Docker-DNS und der macvlan-Hairpin auf TrueNAS spielt keine Rolle).
      # Token kommt aus den SOPS-Secrets (siehe secrets.enc.env) und wird NICHT
      # in der gespeicherten remote-URL persistiert — repo-lokaler credential-
      # helper liefert es zur Laufzeit aus der Env-Variable.
      GIT_REPO_DIR: /opt/console/repo
      GIT_REMOTE: origin
      GIT_BRANCH: main
      FORGEJO_BASE_URL: https://git.${LAB_DOMAIN}              # für UI-Commit-Links (extern, fürs Browser-Click-Through)
      FORGEJO_REPO: christian/cluster
      FORGEJO_CLONE_URL: http://forgejo:3000/christian/cluster.git   # docker-internal: clone+push gehen hier durch
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}                         # Forgejo-PAT mit write-Recht auf christian/cluster — neuer Eintrag in secrets.enc.env
      CONSOLE_GIT_AUTHOR_NAME: pi-console
      CONSOLE_GIT_AUTHOR_EMAIL: console@cluster.local
      INVENTORY_RETRY_TICK_SECONDS: "30"                      # Background-Retry der Push-Queue
      # --- Phase 2c: tftpboot-Symlink-Verwaltung ---
      # Nach jedem erfolgreichen inventory-push synct die Console
      # <TFTPBOOT_DIR>/<short-serial> -> installer-boot für alle Hosts
      # (REPLACE-Hosts werden geskippt). Bind-mount unten.
      TFTPBOOT_DIR: /tftpboot
      TFTPBOOT_LINK_TARGET: installer-boot
      # --- Phase 2g: Wipe-via-SSH ---
      # Private-Key liegt als bind-gemountete Datei im Container (unten).
      # User auf den Pis ist 'christian' (default), darf via forced-command
      # nur pi-wipe-self.sh aufrufen + dd/reboot via NOPASSWD-sudo.
      CONSOLE_WIPE_SSH_KEY: /etc/console/wipe-ssh.key
      CONSOLE_WIPE_SSH_USER: christian
      CONSOLE_WIPE_SSH_TIMEOUT_SECONDS: "10"
      # Image-Build-Button nutzt FORGEJO_TOKEN ohnehin schon (Phase 1) — gleiche Var.
      FORGEJO_WORKFLOW: build-pi5-image.yml
      FORGEJO_REF: main
    volumes:
      - /mnt/data/provisioning/control:/control              # nodes.yaml, arm.d, provision.log (k3s-token NICHT ausliefern!)
      - /mnt/data/provisioning/seed:/seed
      - /mnt/data/provisioning/http/images:/images:ro
      - /mnt/data/provisioning/repo:/opt/console/repo:rw     # Phase 2b: Working-Tree (entrypoint klont initial wenn .git fehlt)
      - /mnt/data/provisioning/tftpboot:/tftpboot:rw         # Phase 2c: Console synct <short-serial>-Symlinks nach jedem commit
      - /mnt/fast/appdata/netboot-console/wipe-ssh.key:/etc/console/wipe-ssh.key:ro  # Phase 2g: SSH-Private-Key
    labels:
      - traefik.enable=true
      - traefik.http.routers.netboot.rule=Host(`netboot.${LAB_DOMAIN}`)
      - traefik.http.routers.netboot.entrypoints=websecure
      - traefik.http.routers.netboot.tls.certresolver=le
      - traefik.http.services.netboot.loadbalancer.server.port=8081   # App lauscht auf 8081 (war fälschlich 8090)
    networks: [edge, netboot-internal]
    mem_limit: 128m
    restart: unless-stopped

networks:
  edge:
    external: true
  netboot-internal:
  # vlan80 wird von 00-traefik angelegt (macvlan, parent enp3s0) und hier nur wiederverwendet
  # -> kein zweites macvlan auf demselben Parent/Subnetz (das würde kollidieren).
  vlan80:
    external: true
    name: vlan80

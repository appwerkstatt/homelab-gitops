# 30-netboot — CUSTOM-APP: Pi-5-Netboot-Provisionierung.
# dnsmasq (Proxy-DHCP+TFTP, eigene IP .49 via macvlan) + nginx (Seeds/Images) + Go-Konsole.
# Daten bleiben auf data/provisioning (kein Re-Build). NFS-Exporte (nfsroot/control) aus Phase 1.5.
name: netboot

services:
  dnsmasq:
    image: dockurr/dnsmasq:2.92      # gepinnt (war :latest = Update-Risiko)
    cap_add: [NET_ADMIN]
    volumes:
      - /mnt/data/provisioning/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - /mnt/data/provisioning/tftpboot:/tftpboot        # muss zu tftp-root in dnsmasq.conf passen (/tftpboot)
    networks:
      vlan80:
        ipv4_address: 192.168.80.49      # eigene MAC/IP auf dem geteilten vlan80-macvlan (aus 00-traefik, parent enp3s0)
    mem_limit: 64m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine          # gepinnt (war :alpine = floating)
    volumes:
      - /mnt/data/provisioning/nginx-seed.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/data/provisioning/seed:/srv/seed:ro       # cloud-init-Seeds (per $remote_addr)
      - /mnt/data/provisioning/http:/srv/http:ro       # Pi-5-Golden-Images
    ports:
      - "8080:80"                                       # von den Pi-Nodes im VLAN erreichbar
    networks: [netboot-internal]
    mem_limit: 64m
    restart: unless-stopped

  console:
    # NAS-lokaler Pull-Pfad (127.0.0.1:5000 = Zot, siehe 22-harbor) — der NAS-Host erreicht
    # registry.lab.appsfab.org (.48/Traefik) wegen macvlan-Hairpin nicht.
    image: 127.0.0.1:5000/library/netboot-console:v3
    environment:
      LISTEN_ADDR: ":8081"
      # --- OIDC gegen Keycloak (Client netboot-console) ---
      OIDC_ISSUER: https://auth.${LAB_DOMAIN}/realms/AppsFab
      OIDC_CLIENT_ID: netboot-console
      OIDC_CLIENT_SECRET: ${NETBOOT_OIDC_CLIENT_SECRET}      # in Keycloak regenerieren
      OIDC_REDIRECT_URL: https://netboot.${LAB_DOMAIN}/auth/callback   # App-Route ist /auth/callback (main.go)
      OIDC_SCOPES: openid,profile,email                      # KEIN groups (Claim kommt per Mapper)
      ARM_GROUPS: lab-admins                                 # nur diese Keycloak-Gruppe darf "armen"
      COOKIE_SECURE: "true"                                  # hinter Traefik-TLS
      # --- Pfade ---
      CONTROL_DIR: /control
      SEED_DIR: /seed
      CLOUDINIT_DIR: /opt/console/cloud-init                 # ins Image kopiert
      IMAGE_DIR: /images                                     # Golden-Images für den nodes.yaml-Editor (ro)
    volumes:
      - /mnt/data/provisioning/control:/control              # nodes.yaml, arm.d, provision.log (k3s-token NICHT ausliefern!)
      - /mnt/data/provisioning/seed:/seed
      - /mnt/data/provisioning/http/images:/images:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.netboot.rule=Host(`netboot.${LAB_DOMAIN}`)
      - traefik.http.routers.netboot.entrypoints=websecure
      - traefik.http.routers.netboot.tls.certresolver=le
      - traefik.http.services.netboot.loadbalancer.server.port=8081   # App lauscht auf 8081 (war fälschlich 8090)
    networks: [edge, netboot-internal]
    mem_limit: 128m
    restart: unless-stopped

networks:
  edge:
    external: true
  netboot-internal:
  # vlan80 wird von 00-traefik angelegt (macvlan, parent enp3s0) und hier nur wiederverwendet
  # -> kein zweites macvlan auf demselben Parent/Subnetz (das würde kollidieren).
  vlan80:
    external: true
    name: vlan80

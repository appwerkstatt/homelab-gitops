# console-rbac.yaml — dediziertes ServiceAccount + RBAC für die netboot-console.
#
# Hintergrund: Vor diesem Manifest authentifizierte sich die Console (wenn
# überhaupt KUBECONFIG gesetzt war) mit dem default /etc/rancher/k3s/k3s.yaml-
# Admin-Token (Group system:masters → cluster-admin). Das funktioniert, ist
# aber ein wandelnder Foot-Gun: wer die Console kompromittiert, hat full
# control-plane.
#
# Dieses Manifest erzeugt:
#   1. ServiceAccount kube-system/netboot-console (eigene Identity)
#   2. Long-lived Service-Account-Token-Secret (legacy-Type, da k8s 1.24+
#      sonst nur kurze TokenRequest-Token ausgibt; die Console hat keinen
#      Token-Refresh-Loop)
#   3. ClusterRole netboot-console (genau die Verbs die /api/k8s/* braucht)
#   4. ClusterRoleBinding bindet SA → ClusterRole
#
# Operator-Step nach dem Apply: Token + CA aus dem Secret extrahieren und
# eine restricted kubeconfig zusammenbauen, die als KUBECONFIG der Console
# auf TrueNAS bind-gemountet wird (siehe README in diesem Verzeichnis bzw.
# Commit-Body, der diese Datei einführt).
#
# Phase 3b — Cluster-Operations.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: netboot-console
  namespace: kube-system
---
# Legacy-Style Service-Account-Token-Secret: k8s ≥1.24 erzeugt nicht mehr
# automatisch ein Token-Secret pro SA. Wir legen eines manuell an, das vom
# controller-manager mit token+ca.crt+namespace befüllt wird. Long-lived
# (kein Ablauf) — passt, weil Console keinen Token-Rotation-Mechanismus hat.
apiVersion: v1
kind: Secret
metadata:
  name: netboot-console-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: netboot-console
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netboot-console
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netboot-console
subjects:
  - kind: ServiceAccount
    name: netboot-console
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: netboot-console
  apiGroup: rbac.authorization.k8s.io

# =============================================================================
# dnsmasq.conf — Proxy-DHCP + TFTP für Pi-Netboot (läuft auf TrueNAS, .50)
# =============================================================================
# WICHTIG: PROXY-Modus. dnsmasq vergibt KEINE Leases und KEINE IPs — das macht
# weiterhin die Unifi-CGU. dnsmasq antwortet nur zusätzlich mit den Boot-Infos
# (TFTP-Server + "Raspberry Pi Boot"). So koexistiert es konfliktfrei mit dem
# Unifi-DHCP.
#
# Betrieb: als Container im macvlan-Netz vlan80 (.49), siehe compose.yaml in
# diesem Verzeichnis. Macvlan ist nötig damit dnsmasq die echten L2-DHCP-
# Broadcasts der Pi-Bootloader empfängt.
#
# Wo gepflegt: dieser Datei (homelab-gitops/stacks/30-netboot/dnsmasq.conf).
# Arcane bind-mountet sie direkt in den dnsmasq-Container, kein scp/cp mehr.
# Nach Edit + push + Arcane Sync: 'docker compose restart dnsmasq' für den
# 30-netboot-Stack (dnsmasq hat keinen reload-Signal-Mechanismus).
# =============================================================================

# DNS komplett abschalten — wir wollen NUR DHCP-Proxy + TFTP, kein DNS.
port=0

# macvlan-Container: die eigene Schnittstelle heißt eth0 (NICHT der Host-IF-Name).
# Das echte Host-Interface kommt in docker-compose.yml unter "parent:".
interface=eth0
# bind-dynamic statt bind-interfaces: bindet eth0, sobald es da ist, und scheitert
# nicht, falls das macvlan-IF beim dnsmasq-Start noch nicht fertig konfiguriert ist
# ("unknown interface eth0" beim Container-Start).
bind-dynamic

# --- Proxy-DHCP -------------------------------------------------------------
# ",proxy" = NICHT selbst Leases vergeben, nur PXE/Boot-Infos beisteuern.
# Subnetz an dein VLAN anpassen.
dhcp-range=192.168.80.0,proxy

# Der Pi-5-Bootloader meldet sich mit der Vendor-Class "PXEClient".
# Wir taggen solche Anfragen und liefern ihnen den Boot-Service.
dhcp-vendorclass=set:rpi,PXEClient

# Boot-Menü-Eintrag, den der Pi-Bootloader erwartet. Der Name "Raspberry Pi Boot"
# ist Konvention; der Pi nimmt den ersten passenden pxe-service.
pxe-service=tag:rpi,0,"Raspberry Pi Boot"

# --- TFTP -------------------------------------------------------------------
enable-tftp
tftp-root=/tftpboot
# Der Pi-Bootloader sucht standardmäßig im Unterordner, der nach seiner
# SERIENNUMMER benannt ist (z.B. /tftpboot/<serial>/). Falls du einen
# gemeinsamen Boot-Ordner ohne Serial-Subdir willst, kann tftp-unique-root
# das steuern — wir bleiben aber bei Serial-Subdirs (siehe nfs-exports.md).
tftp-no-fail

# --- Logging (beim Einrichten hilfreich, später auf Wunsch reduzieren) ------
log-dhcp
log-queries

# =============================================================================
# nginx-seed.conf — wird als /etc/nginx/conf.d/default.conf in den http-Container
# gemountet (ersetzt die Default-Config). Liefert:
#   /images/        -> Golden Images (statisch)
#   /seed/<host>/   -> cloud-init NoCloud-Seed, PRO HOSTNAME (Phase 2f)
# =============================================================================
# Der INSTALLER (pi-provision.sh) kennt seinen $HOSTNAME aus dem yq-Lookup über
# die Serial in nodes.yaml und holt den Seed an /seed/<host>/{user-data,meta-data}.
# nginx routet den Pfad direkt nach /srv/seed/<host>/ — keine $remote_addr-map
# mehr, damit auch kein DHCP-Drift-Bug und keine Doppelpflege nginx-seed.conf
# gegen Inventory.
# =============================================================================
# Wo gepflegt: dieser Datei (homelab-gitops/stacks/30-netboot/nginx-seed.conf).
# Arcane bind-mountet sie direkt in den nginx-Container, kein scp/cp mehr.
# Nach Edit + push + Arcane Sync: docker exec netboot-nginx-1 nginx -s reload
# (oder Arcane "restart nginx" — Container-Restart ist ~1s blip).
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    # --- Golden Images ---
    location /images/ {
        root /usr/share/nginx/html;     # -> /usr/share/nginx/html/images/<datei>
        autoindex off;
    }

    # --- cloud-init Seed, per Hostname ---
    # Phase 2f: Hostname kommt aus dem URL-Pfad, nicht mehr aus $remote_addr.
    # Regex-Capture-Groups: <cinode> = Hostname, <seedfile> = user-data|meta-data.
    # ($host wäre eine Kollision mit dem nginx-built-in für den Host-Header —
    # daher cinode wie schon in der pre-Phase-2f-Map-Variante.)
    # Unbekannter Host -> /srv/seed/<host>/... existiert nicht -> 404 (gewollt;
    # macht es im Installer-Log sichtbar dass der Host noch nicht gerendert ist).
    location ~ ^/seed/(?<cinode>[^/]+)/(?<seedfile>[^/]+)$ {
        alias /srv/seed/$cinode/$seedfile;
        default_type text/plain;
    }
}

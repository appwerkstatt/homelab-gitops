# 40-homepage — zentrale Einstiegsseiten (Dashboard). Config-as-Code.
# Zwei Instanzen, weil Homepage nicht nach Gruppen filtern kann (Rechtekonzept: docs/sicherheit/rechtekonzept.md):
#   homepage        -> home.lab  (Familie, sso@docker, nur Links)        Config ./config-family
#   homepage-admin  -> admin.lab (Admin, sso-admin@docker, Status+Widgets) Config ./config
name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0   # neuester Stand (11.05.2026)
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${LAB_DOMAIN}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Keine Widget-Secrets: die Familienseite zeigt nur Links.
    volumes:
      - ./config-family:/app/config          # Familien-Startseite aus dem Repo (GitOps)
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-home
      - traefik.http.routers.homepage.rule=Host(`home.${LAB_DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=le
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - traefik.http.routers.homepage.middlewares=sso@docker   # Keycloak-Login, Gruppe lab-users (Stack 03)
    networks: [edge-home]
    mem_limit: 192m
    restart: unless-stopped

  homepage-admin:
    image: ghcr.io/gethomepage/homepage:v2.7.0   # gleiche Version wie homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: admin.${LAB_DOMAIN}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Widget-Secrets (1Password-Item homelab-homepage, s. .env.example). In der Config als {{HOMEPAGE_VAR_…}}.
      HOMEPAGE_VAR_GRAFANA_TOKEN: ${HOMEPAGE_GRAFANA_TOKEN}       # Grafana-Service-Account "homepage", Rolle Viewer
      HOMEPAGE_VAR_PAPERLESS_TOKEN: ${HOMEPAGE_PAPERLESS_TOKEN}   # API-Token des Paperless-Users "homepage" (nur Lesen)
    volumes:
      - ./config:/app/config                 # Admin-Dashboard aus dem Repo (GitOps)
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-home
      - traefik.http.routers.homepage-admin.rule=Host(`admin.${LAB_DOMAIN}`)
      - traefik.http.routers.homepage-admin.entrypoints=websecure
      - traefik.http.routers.homepage-admin.tls.certresolver=le
      - traefik.http.services.homepage-admin.loadbalancer.server.port=3000
      - traefik.http.routers.homepage-admin.middlewares=sso-admin@docker   # nur lab-admins (Stack 03); Callback im Realm-Client oauth2-proxy
    # Nur edge-home: Status-Checks und Widgets laufen über Traefik (FQDN-Aliase in 00-traefik, edge-home).
    networks: [edge-home]
    mem_limit: 256m          # 128m lag bei 97 % (2026-11-22)
    restart: unless-stopped

networks:
  edge-home:
    external: true   # von 00-traefik angelegt; nur Traefik teilt es mit diesem Stack

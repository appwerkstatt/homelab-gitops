# 40-homepage — zentrale Einstiegsseite (Dashboard). Config-as-Code aus ./config.
name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2   # neuester Stand (11.05.2026)
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${LAB_DOMAIN}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./config:/app/config                 # Dashboard-Definition aus dem Repo (GitOps)
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`home.${LAB_DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=le
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      # Optional hinter SSO: traefik.http.routers.homepage.middlewares=sso@docker
    networks: [edge]
    mem_limit: 128m
    restart: unless-stopped

networks:
  edge:
    external: true

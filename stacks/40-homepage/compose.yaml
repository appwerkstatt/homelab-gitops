# 40-homepage — zentrale Einstiegsseite (Dashboard). Config-as-Code aus ./config.
name: homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0   # neuester Stand (11.05.2026)
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${LAB_DOMAIN}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./config:/app/config                 # Dashboard-Definition aus dem Repo (GitOps)
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-home
      - traefik.http.routers.homepage.rule=Host(`home.${LAB_DOMAIN}`)
      - traefik.http.routers.homepage.entrypoints=websecure
      - traefik.http.routers.homepage.tls.certresolver=le
      - traefik.http.services.homepage.loadbalancer.server.port=3000
      - traefik.http.routers.homepage.middlewares=sso@docker   # Keycloak-Login (Stack 03); Callback im Realm-Client oauth2-proxy
    networks: [edge-home]
    mem_limit: 128m
    restart: unless-stopped

networks:
  edge-home:
    external: true   # von 00-traefik angelegt; nur Traefik teilt es mit diesem Stack

# Dienste (https://gethomepage.dev/configs/services/). Gruppen-Reihenfolge/Spalten: settings.yaml.
#
# Erreichbarkeit: Homepage hängt nur an edge-home und erreicht alles über Traefik. Damit die echten
# FQDNs nicht auf .48 zeigen (macvlan-Hairpin), hat Traefik in edge-home Netz-Aliase für genau die Hosts
# unten (stacks/00-traefik/compose.yaml). Neuer siteMonitor/Widget-Host ⇒ dort als Alias eintragen.
# siteMonitor: HTTP ≤ 403 = grün (401/403 von Login/Allowlist zählt als "lebt").
#
# Secrets kommen als HOMEPAGE_VAR_* aus der Arcane-Env (compose.yaml, .env.example → 1Password).
#
# Status-Kacheln fragen VictoriaMetrics über den Grafana-Datasource-Proxy (uid victoriametrics) mit einem
# Viewer-Service-Account-Token. Queries sind MetricsQL (sort_by_label/union/label_set = VM-Erweiterungen),
# die Reihenfolge der Ergebnisse ist über das Label k festgelegt, damit die Indizes in mappings stimmen.
# Geschweifte Klammern der Label-Matcher MÜSSEN als %7B/%7D stehen: Homepage ersetzt {…} in URLs als
# Platzhalter (ein roher Matcher würde stillschweigend gelöscht).

- Status:
    - Grafana:
        icon: grafana.png
        href: https://grafana.lab.appsfab.org
        description: Dashboards (VictoriaMetrics + Loki), Keycloak-Login
        siteMonitor: https://grafana.lab.appsfab.org/api/health
    - Dienste:
        icon: mdi-heart-pulse
        href: https://grafana.lab.appsfab.org
        description: blackbox-Probes + vmalert
        widget:
          type: customapi
          url: >-
            https://grafana.lab.appsfab.org/api/datasources/proxy/uid/victoriametrics/api/v1/query?query=sort_by_label(union(
            label_set(count(probe_success%7Bjob=~"probe-.*"%7D == 1) or vector(0), "k", "1"),
            label_set(count(probe_success%7Bjob=~"probe-.*"%7D) or vector(0), "k", "2"),
            label_set(count(ALERTS%7Balertstate="firing"%7D) or vector(0), "k", "3")), "k")
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_GRAFANA_TOKEN}}
          refreshInterval: 60000
          mappings:
            - label: Probes ok
              field: data.result.0.value.1
              format: number
            - label: Probes gesamt
              field: data.result.1.value.1
              format: number
            - label: Alerts aktiv
              field: data.result.2.value.1
              format: number
    - Alerts:
        icon: telegram.png
        description: vmalert → Alertmanager → Telegram
        widget:
          type: customapi
          url: >-
            https://grafana.lab.appsfab.org/api/datasources/proxy/uid/victoriametrics/api/v1/query?query=ALERTS%7Balertstate="firing"%7D
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_GRAFANA_TOKEN}}
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data.result
            name: metric.alertname
            label: metric.severity
            limit: 5
    - NAS:
        icon: truenas-scale.png
        href: https://192.168.80.50
        description: TrueNAS 25.10 · freier Platz je Pool
        widget:
          type: customapi
          url: >-
            https://grafana.lab.appsfab.org/api/datasources/proxy/uid/victoriametrics/api/v1/query?query=sort_by_label(union(
            label_set(100 * (1 - avg(rate(node_cpu_seconds_total%7Binstance="node-exporter:9100",mode="idle"%7D[5m]))) or vector(0), "k", "1"),
            label_set(max(node_filesystem_avail_bytes%7Binstance="node-exporter:9100",mountpoint="/mnt/fast"%7D) or vector(0), "k", "2"),
            label_set(max(node_filesystem_avail_bytes%7Binstance="node-exporter:9100",mountpoint="/mnt/data"%7D) or vector(0), "k", "3"),
            label_set(max(node_filesystem_avail_bytes%7Binstance="node-exporter:9100",mountpoint="/mnt/backup"%7D) or vector(0), "k", "4")), "k")
          headers:
            Authorization: Bearer {{HOMEPAGE_VAR_GRAFANA_TOKEN}}
          refreshInterval: 60000
          mappings:
            - label: CPU
              field: data.result.0.value.1
              format: percent
            - label: fast frei
              field: data.result.1.value.1
              format: bytes
            - label: data frei
              field: data.result.2.value.1
              format: bytes
            - label: backup frei
              field: data.result.3.value.1
              format: bytes


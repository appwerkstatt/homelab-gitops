# n8n-sandbox — Code-Sandbox für den n8n-Assistenten (Instance AI), nach der offiziellen Vorlage
# https://github.com/n8n-io/n8n/blob/master/docker/get-n8n-compose.yml (nur der Sandbox-Teil).
#
# LÄUFT NICHT AUF DEM NAS und NICHT über Arcane, sondern in der eigenen VM "n8n-sandbox"
# (TrueNAS-Instanz, Anleitung: README.md daneben). Grund: sandbox-runner-1 ist ein privilegierter
# Docker-in-Docker-Container — laut n8n "equivalent to root on the host". In der VM ist ein Ausbruch
# auf eine Wegwerf-Maschine ohne Daten begrenzt.
#
# Version: alle drei Images (api, runner, sandbox) gehören zu EINEM Release und gehen nur zusammen.
# Deshalb eine Variable N8N_SANDBOX_VERSION in .env (Renovate fasst sie bewusst nicht an).
name: n8n-sandbox

volumes:
  sandbox-tls:          # mTLS zwischen API und Runner inkl. Root-CA-Key; Zertifikate erneuern sich NICHT

services:
  # Einmal-Job: erzeugt die mTLS-Zertifikate (SANs sandbox-api / sandbox-runner-<n>), dann exit 0.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:${N8N_SANDBOX_VERSION}
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    env_file: .env     # = gerenderte sandbox.env.tpl; nur Sandbox-Secrets (aus 1Password), keine n8n-/LLM-Keys
    environment:
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    # Einziger veröffentlichter Port: n8n auf dem NAS ruft http://<VM-IP>:8080 (API-Key-geschützt).
    # Die VM-Firewall (README, DOCKER-USER-Regel) lässt 8080 nur vom NAS zu. 9090 (gRPC) bleibt intern.
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  sandbox-runner-1:       # Name nicht ändern: steckt in den Zertifikats-SANs
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_VERSION}
    privileged: true      # Docker-in-Docker; NIE Ports veröffentlichen
    depends_on:
      sandbox-api:
        condition: service_healthy
    env_file: .env
    environment:
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:${N8N_SANDBOX_VERSION}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    restart: unless-stopped
